name: CI - Pull Request Validation

on:
  pull_request:
    branches:
      - Development
      - main
    types:
      - opened # Quando o PR é criado
      - synchronize # Quando novos commits são enviados para um PR já existente
      - reopened # Quando um PR é fechado e depois reaberto
      - ready_for_review # Quando um PR é criado como rascunho e depois marcado como pronto para revisão

  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:

      - name: 01 - Checkout code
        uses: actions/checkout@v4

      - name: 02 - Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 03 - Restore dependencies
        run: dotnet restore ../fiap-esperanca-solidaria-doacao-work.slnx

      - name: 04 - Build solution
        run: dotnet build ../fiap-esperanca-solidaria-doacao-work.slnx --configuration Release --no-restore

      - name: 05 - Run tests with coverage
        run: >
          dotnet test
          ../tests/EsperancaSolidaria.Doacao.Tests/EsperancaSolidaria.Doacao.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"

      - name: 06 - Check vulnerable packages
        shell: bash
        run: |
          dotnet package list \
            --project ../fiap-esperanca-solidaria-doacao-work.slnx \
            --vulnerable \
            --fail-on-vulnerable

      - name: 07 - Check outdated packages
        shell: bash
        run: |
          dotnet package list --project ../fiap-esperanca-solidaria-doacao-work.slnx --outdated > outdated.txt

          cat outdated.txt

          if grep -Eqi "outdated package|outdated packages" outdated.txt; then
            echo "::warning::Outdated NuGet packages were found."
          fi